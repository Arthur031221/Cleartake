name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      real_models:
        description: Also run the tests that download and run the real models
        type: boolean
        default: false

env:
  UV_HTTP_TIMEOUT: "120"
  UV_HTTP_RETRIES: "5"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          # torch alone comes from the CPU index. With --extra-index-url uv asks that index about every
          # package, and one timeout there failed the whole job.
          uv pip install --index-url https://download.pytorch.org/whl/cpu --no-deps torch torchaudio
          uv pip install -e ".[dev]" torch torchaudio
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          .venv/bin/ruff format --check .
          .venv/bin/ruff check .
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Build the wheel
        run: uv build --wheel

  real-models:
    if: github.event_name == 'workflow_dispatch' && inputs.real_models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          uv venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu --no-deps torch torchaudio
          uv pip install -e ".[dev]" torch torchaudio
      - run: .venv/bin/python -m pytest -q -m model
