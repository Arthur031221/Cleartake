[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleartake"
version = "0.1.0"
description = "Local speech enhancement for voice recordings and videos, with a word drift check. A free offline alternative to Adobe Podcast Enhance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "Arthur031221" }]
keywords = ["speech-enhancement", "denoise", "podcast", "audio", "whisper", "loudness"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "numpy<2",
  "soundfile",
  "scipy",
  "clearvoice>=0.1.2",
  "faster-whisper>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "playwright>=1.45"]
bench = ["pyarrow<18", "huggingface-hub", "speechmos"]

[project.scripts]
cleartake = "cleartake.cli:main"

[project.urls]
Homepage = "https://github.com/Arthur031221/Cleartake"
Demo = "https://arthur031221.github.io/Cleartake/"

[tool.hatch.build.targets.wheel]
packages = ["src/cleartake"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the real enhancement models and a network on first run",
    "e2e: drives the web interface in a real browser",
]
addopts = "-m 'not model'"
